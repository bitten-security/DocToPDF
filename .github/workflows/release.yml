name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
        env: { QT_QPA_PLATFORM: offscreen }

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: python build.py
      - name: Build installer
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v"); if (-not $v -or $v -eq "main") { $v = "0.0.0" }
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /Qp "/DAppVersion=$v" installer\DocToPDF.iss
      - uses: actions/upload-artifact@v4
        with: { name: windows-installer, path: dist/DocToPDF-Setup-*.exe }
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with: { files: dist/DocToPDF-Setup-*.exe }

  linux:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: python build.py --onefile
      - run: tar -czf DocToPDF-linux-x86_64.tar.gz -C dist DocToPDF
      - uses: actions/upload-artifact@v4
        with: { name: linux-binary, path: DocToPDF-linux-x86_64.tar.gz }
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with: { files: DocToPDF-linux-x86_64.tar.gz }
