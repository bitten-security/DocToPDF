name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Tk and display for the GUI smoke test
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - run: pip install -r requirements-dev.txt
      - name: Test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a pytest -q
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: pytest -q

  windows:
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}
      - run: pip install -r requirements-dev.txt
      - run: python build.py
      - name: Smoke-test the frozen app (CLI conversion)
        shell: pwsh
        run: |
          "hello" | Set-Content smoke.txt
          $p = Start-Process "dist\${{ matrix.arch }}\DocToPDF\DocToPDF.exe" -ArgumentList "smoke.txt" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path smoke.pdf)) { throw "frozen app failed to convert" }
      - name: Build installer
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v"); if ($v -notmatch '^\d') { $v = "0.0.0" }
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /Qp "/DAppVersion=$v" "/DArch=${{ matrix.arch }}" installer\DocToPDF.iss
      - uses: actions/upload-artifact@v4
        with: { name: windows-${{ matrix.arch }}, path: "dist/DocToPDF-Setup-*.exe" }

  linux:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: pip install -r requirements-dev.txt
      - run: python build.py --onefile
      - run: tar -czf DocToPDF-linux-x86_64.tar.gz -C dist/linux DocToPDF
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: DocToPDF-linux-x86_64.tar.gz }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: artifacts/* }
